name: Create release and upload to Apple and Google
on:
  push:
    tags:
      # Only builds for tags with a meaningless build number suffix: v1.0.0-1
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  # Federating into AWS for the signing credentials; without it the failure blames
  # credentials rather than the missing permission
  id-token: write
  # Creating the draft release
  contents: write

jobs:
  build:
    name: Build ios and android package
    runs-on: macos-26

    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #6.0.2
        with:
          show-progress: false
          fetch-depth: 75 # For sentry releases

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 #6.5.0
        with:
          go-version-file: nebula/go.mod
          cache-dependency-path: nebula/go.sum

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 #v5.2.0
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: "gradle"

      - name: Install flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e #v2.21.0
        with:
          flutter-version: '3.44.6'
          cache: true

      - name: Setup bundletool for APK generation
        run: |
          curl -Lo bundletool.jar https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar

      - name: Install the google play key material
        env:
          GOOGLE_PLAY_API_JWT_BASE64: ${{ secrets.GOOGLE_PLAY_API_JWT_BASE64 }}
          GOOGLE_PLAY_KEYSTORE_BASE64: ${{ secrets.GOOGLE_PLAY_KEYSTORE_BASE64 }}
        run: |
          GOOGLE_PLAY_API_JWT_PATH="$RUNNER_TEMP/gp_api.json"
          echo "GOOGLE_PLAY_API_JWT_PATH=$GOOGLE_PLAY_API_JWT_PATH" >> $GITHUB_ENV
          echo -n "$GOOGLE_PLAY_API_JWT_BASE64" | base64 --decode --output "$GOOGLE_PLAY_API_JWT_PATH"

          GOOGLE_PLAY_KEYSTORE_PATH="$RUNNER_TEMP/gp_signing.jks"
          echo "GOOGLE_PLAY_KEYSTORE_PATH=$GOOGLE_PLAY_KEYSTORE_PATH" >> $GITHUB_ENV
          echo -n "$GOOGLE_PLAY_KEYSTORE_BASE64" | base64 --decode --output "$GOOGLE_PLAY_KEYSTORE_PATH"

      - name: Get build name and number, install dependencies
        env:
          TOKEN: ${{ secrets.MACHINE_USER_PAT }}
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

          flutter pub get

          touch env.sh

          cd android
          fastlane release_build_number
          echo "BUILD_NUMBER=$(cat ../release_build_number)" >> $GITHUB_ENV
          BUILD_NAME="${GITHUB_REF#refs/tags/v}" # strip the front refs/tags/v off
          BUILD_NAME="${BUILD_NAME%-*}" # strip the junk build number off
          echo "BUILD_NAME=$BUILD_NAME" >> $GITHUB_ENV

      - name: flutter test
        run: |
          ./gen-artifacts.sh skip
          flutter test

      - name: Build Android
        env:
          TOKEN: ${{ secrets.MACHINE_USER_PAT }}
          GOOGLE_PLAY_KEYSTORE_PASSWORD: ${{ secrets.GOOGLE_PLAY_KEYSTORE_PASSWORD }}
        run: |
          flutter build appbundle --build-number="$BUILD_NUMBER" --build-name="$BUILD_NAME"

          # verify that the github token didn't make it into the output
          mkdir -p build/app/test-android
          cp build/app/outputs/bundle/release/app-release.aab build/app/test-android
          cd build/app/test-android
          unzip app-release.aab
          if find . | xargs strings 2>/dev/null | grep -qF "${TOKEN}" ; then
            echo "Token found in Android build"
            exit 1
          fi

      - name: Generate universal APK
        env:
          TOKEN: ${{ secrets.MACHINE_USER_PAT }}
          GOOGLE_PLAY_KEYSTORE_PASSWORD: ${{ secrets.GOOGLE_PLAY_KEYSTORE_PASSWORD }}
        run: |
          java -jar bundletool.jar build-apks \
            --bundle=build/app/outputs/bundle/release/app-release.aab \
            --output=build/app/outputs/apk/release/MobileNebula.apks \
            --mode=universal \
            --ks=$GOOGLE_PLAY_KEYSTORE_PATH \
            --ks-key-alias=key \
            --ks-pass=pass:$GOOGLE_PLAY_KEYSTORE_PASSWORD
          unzip -p build/app/outputs/apk/release/MobileNebula.apks universal.apk > build/app/outputs/apk/release/MobileNebula.apk

      - name: Collect Android artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f #6.0.0
        with:
          name: MobileNebula.aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 5

      # Late on purpose. Everything above runs third party code, and the secrets
      # action writes to GITHUB_ENV, which every later step in the job inherits.
      # Android having already built means a gradle failure cannot publish iOS
      # on its own.
      #
      # GitHub holds ARNs, not credentials. See ansible docs/apple-signing.md.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c #v6.2.3
        with:
          role-to-assume: ${{ secrets.APPLE_SIGNING_ROLE_ARN }}
          aws-region: us-east-2

      # parse-json-secrets unpacks into SIGNING_* and ASC_*, masked on the way in
      - name: Fetch signing credentials
        uses: aws-actions/aws-secretsmanager-get-secrets@2cb1a461cbd4865ac4299648312e4704c646cd53 #v3.0.1
        with:
          parse-json-secrets: true
          secret-ids: |
            SIGNING,${{ secrets.APPLE_SIGNING_DISTRIBUTION_ARN }}
            ASC,${{ secrets.APPLE_ASC_API_KEY_ARN }}

      - name: Import certificates
        uses: Apple-Actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 #v7.0.0
        with:
          p12-file-base64: ${{ env.SIGNING_P12_BASE64 }}
          p12-password: ${{ env.SIGNING_PASSWORD }}

      # The action imports but does not check the chain validates, which is how a p12
      # missing its intermediate reaches a failing codesign
      - name: Check the identity is usable
        run: |
          : "${SIGNING_IDENTITY_SHA1:?empty, so the secret has no identity_sha1}"
          identities=$(security find-identity -v -p codesigning signing_temp.keychain)
          case "$identities" in
          *"$SIGNING_IDENTITY_SHA1"*) ;;
          *) printf '%s\n' "$identities" >&2; exit 1 ;;
          esac

      # Under the names fastlane's app_store_connect_api_key and xcodebuild's
      # -authenticationKeyPath expect.
      - name: Write the App Store Connect key
        run: |
          key_dir="$RUNNER_TEMP/asc"
          mkdir -p "$key_dir"
          chmod 700 "$key_dir"
          key_path="$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          (umask 077; printf '%s\n' "$ASC_PRIVATE_KEY" > "$key_path")
          {
            echo "APP_STORE_CONNECT_API_KEY_KEY_FILEPATH=$key_path"
            echo "APP_STORE_CONNECT_API_KEY_KEY_ID=$ASC_KEY_ID"
            echo "APP_STORE_CONNECT_API_KEY_ISSUER_ID=$ASC_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Build iOS
        env:
          TOKEN: ${{ secrets.MACHINE_USER_PAT }}
        run: |
          ./ensure-mobile-nebula.sh
          # config-only raises the generated plugin package deployment target to match
          # the project, required before driving xcodebuild directly
          flutter build ios --release --config-only --no-codesign
          cd ios
          fastlane build
          cd -

          # verify that the github token didn't make it into the output
          mkdir -p build/app/test-ios
          cp ios/MobileNebula.ipa build/app/test-ios
          cd build/app/test-ios
          unzip MobileNebula.ipa
          if find . | xargs strings 2>/dev/null | grep -qF "${TOKEN}" ; then
            echo "Token found in iOS build"
            exit 1
          fi

      - name: Collect iOS artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f #6.0.0
        with:
          name: MobileNebula.ipa
          path: ios/MobileNebula.ipa
          retention-days: 5

      # Both platforms are built by now and neither publish has happened, so a
      # failure above this line still publishes nothing anywhere. Keep these two
      # adjacent and keep them last.
      - name: Publish to iOS TestFlight
        run: |
          cd ios
          fastlane release

      # Nothing below needs them, and the Sentry upload runs code we do not own
      - name: Drop the Apple credentials
        run: |
          security delete-keychain signing_temp.keychain || true
          rm -f "$APP_STORE_CONNECT_API_KEY_KEY_FILEPATH"
          {
            echo "SIGNING_P12_BASE64="
            echo "SIGNING_PASSWORD="
            echo "ASC_PRIVATE_KEY="
            echo "APP_STORE_CONNECT_API_KEY_KEY_FILEPATH="
          } >> "$GITHUB_ENV"

      - name: Publish to Android internal track
        run: |
          cd android
          fastlane release

      - name: Rename app bundle
        run: |
          mv build/app/outputs/bundle/release/app-release.aab \
            build/app/outputs/bundle/release/MobileNebula.aab

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          name: Release ${{ github.ref }}
          draft: true
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            build/app/outputs/bundle/release/MobileNebula.aab
            build/app/outputs/apk/release/MobileNebula.apk
            ios/MobileNebula.ipa

      - name: Upload debug symbols to Sentry
        run: flutter packages pub run sentry_dart_plugin
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
